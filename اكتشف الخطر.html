<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اكتشف الخطر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B1B2F;--panel:#2A2A45;--line:#4A4A7A;--cy:#00E5FF;--red:#FF3B4E;--grn:#3DDC84;--gold:#FFD84D;--mut:#9A9ACC;--card:#11112A;--tx:#E8E8FF;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0f0f1e;overflow:hidden;font-family:'Cairo',sans-serif;color:var(--tx)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;background:var(--bg);transform-origin:center}
.frame{position:absolute;inset:24px;border:4px solid var(--cy);border-radius:8px;pointer-events:none}
.scr{position:absolute;inset:0;display:none}.scr.on{display:block}
.a{position:absolute}
.box{background:var(--panel);border:3px solid var(--line);border-radius:6px}
.px{font-family:'Press Start 2P',monospace}
img{image-rendering:pixelated}
.btn{position:absolute;border:4px solid;border-radius:6px;font:700 28px 'Cairo';cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:transform .08s}
.btn:active{transform:translateY(6px)}
.green{background:var(--grn);border-color:#17703F;box-shadow:0 8px 0 #17703F;color:#0B2A17}
.redb{background:var(--red);border-color:#7A1020;box-shadow:0 8px 0 #7A1020;color:#fff}
.sm{background:var(--panel);border-color:var(--line);box-shadow:0 6px 0 var(--line);color:var(--tx)}
.bubble{padding:0 18px;display:flex;align-items:center;font-size:18px;height:48px}
#card{left:420px;top:200px;width:440px;min-height:250px;background:var(--card);border:4px solid var(--cy);border-radius:8px}
#card .hd{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:3px solid var(--panel)}
#card .av{width:40px;height:40px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center}
#card .bd{padding:18px 22px;font-size:24px;line-height:1.7}
#lnk{direction:ltr;text-align:right;color:#4AA3FF;text-decoration:underline;font-size:20px;margin-top:10px}
#ov{position:absolute;inset:0;background:rgba(27,27,47,.9);display:none;z-index:5}
#ov.on{display:block}
#pn{left:340px;top:170px;width:600px;background:var(--card);border:4px solid;border-radius:8px;padding:26px 32px;text-align:center}
.heart{width:36px;height:36px;fill:var(--red)}.heart.l{fill:var(--line)}
#fill{position:absolute;right:3px;top:3px;bottom:3px;background:var(--grn);transition:background .2s}
.t{text-align:center;width:100%}
</style>
</head>

const TIPS=["انتبه للرابط المختصر!","تأكد من اسم المرسل","لا تثق بالاستعجال","البنك لا يطلب بياناتك برابط"];
const $=i=>document.getElementById(i);
let q,i,hp,sc,ok,t,iv,lock,snd=true,ac,best=0;
try{best=+localStorage.getItem('ps_best')||0}catch(e){}
const pad=n=>String(n).padStart(4,'0');
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);$('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
addEventListener('resize',fit);fit();
function show(n){['start','play','end'].forEach(x=>$(x).classList.toggle('on',x==n))}
function beep(f,d){if(!snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function hearts(){$('hearts').innerHTML=[0,1,2].map(n=>'<svg class="heart'+(n>=hp?' l':'')+'" viewBox="0 0 24 24"><path d="M12 21L3.5 12.5A5 5 0 0 1 12 6a5 5 0 0 1 8.5 6.5z"/></svg>').join('')}
function begin(){q=[...M].sort(()=>Math.random()-.5);i=0;hp=3;sc=0;ok=0;hearts();$('score').textContent=pad(0);show('play');round()}
function round(){const m=q[i];lock=false;t=10;$('ov').classList.remove('on');$('snd2').textContent=m.s;$('txt').textContent=m.t;$('lnk').textContent=m.l;$('lnk').style.display=m.l?'block':'none';$('tip').textContent=TIPS[Math.floor(Math.random()*TIPS.length)];draw();clearInterval(iv);iv=setInterval(()=>{t-=.1;if(t<=0){t=0;draw();answer(null)}else draw()},100)}
function draw(){$('fill').style.width=(t/10*(1162))+'px';$('fill').style.background=t<3?'var(--red)':'var(--grn)';$('tm').textContent='0:'+String(Math.ceil(t)).padStart(2,'0')}
function answer(c){if(lock)return;lock=true;clearInterval(iv);const m=q[i],r=c!==null&&c===m.f;
 if(r){sc+=10+Math.ceil(t);ok++;beep(880,.12)}else{hp--;beep(160,.3)}
 hearts();$('score').textContent=pad(sc);
 const p=$('pn'),col=r?'var(--grn)':'var(--red)';p.style.borderColor=col;
 $('ovT').style.color=col;$('ovT').textContent=r?'صح!':(c===null?'انتهى الوقت!':'خطأ!');
 $('ovA').textContent='الإجابة الصحيحة: '+(m.f?'احتيال':'آمن');$('ovW').textContent=m.w;
 $('nx').textContent=(hp<=0||i+1>=q.length)?'النتيجة':'التالي';$('ov').classList.add('on')}
function finish(){clearInterval(iv);let nb=sc>best;if(nb){best=sc;try{localStorage.setItem('ps_best',best)}catch(e){}}
 $('best').textContent=pad(best);$('endS').textContent=pad(sc);
 const r=ok/q.length;$('rank').textContent='لقبك: '+(r<.4?'مبتدئ':r<.75?'محقق':'خبير أمن سيبراني')+(nb?'  (رقم قياسي جديد!)':'');
 $('endT').textContent=hp<=0?'انتهت اللعبة':'أكملت كل الرسائل!';show('end')}
$('go').onclick=begin;$('again').onclick=begin;
$('bs').onclick=()=>answer(1);$('bf').onclick=()=>answer(0);
$('nx').onclick=()=>{i++;(hp<=0||i>=q.length)?finish():round()};
$('snd').onclick=()=>{snd=!snd;$('wave').style.opacity=snd?1:0};
$('best').textContent=pad(best);
</script>
